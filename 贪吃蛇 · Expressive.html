<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>贪吃蛇 · Expressive</title>
<style>
:root{
  --bg:#fef7ff;--surf:#f3edf7;--surf-hi:#e6e0e9;--surf-lo:#f7f2fa;--on:#1d1b20;--on-v:#49454f;
  --pri:#6750a4;--on-pri:#fff;--pri-c:#eaddff;--on-pri-c:#21005d;
  --sec-c:#e8def8;--ter-c:#ffd8e4;--on-ter-c:#31111d;--err:#b3261e;
  --spring:cubic-bezier(.34,1.56,.64,1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141218;--surf:#211f26;--surf-hi:#2b2930;--surf-lo:#26242b;--on:#e6e0e9;--on-v:#cac4d0;
  --pri:#d0bcff;--on-pri:#381e72;--pri-c:#4f378b;--on-pri-c:#eaddff;--sec-c:#4a4458;--ter-c:#633b48;--on-ter-c:#ffd8e4;--err:#f2b8b5}}
:root[data-theme="dark"]{
  --bg:#141218;--surf:#211f26;--surf-hi:#2b2930;--surf-lo:#26242b;--on:#e6e0e9;--on-v:#cac4d0;
  --pri:#d0bcff;--on-pri:#381e72;--pri-c:#4f378b;--on-pri-c:#eaddff;--sec-c:#4a4458;--ter-c:#633b48;--on-ter-c:#ffd8e4;--err:#f2b8b5}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--on);font-family:"Google Sans Flex","Google Sans","Segoe UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;min-height:100%;display:flex;justify-content:center}
.app{width:100%;max-width:500px;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
h1{margin:6px 4px 0;font-size:30px;font-weight:700;letter-spacing:-.5px}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.stat{background:var(--pri-c);color:var(--on-pri-c);border-radius:28px;padding:10px 16px;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;gap:8px;justify-content:center;align-items:center;transition:transform .3s var(--spring)}
.stat.t{background:var(--ter-c);color:var(--on-ter-c)}
.stat small{font-size:18px}.stat.bump{transform:scale(1.15)}
.round{width:68px;height:68px;border:0;font-size:30px;background:var(--pri);color:var(--on-pri);border-radius:50%;cursor:pointer;transition:border-radius .5s var(--spring),transform .4s var(--spring);display:grid;place-items:center}
.round:hover{border-radius:30%}.round:active{transform:scale(.88);border-radius:42%}
.round.spin{animation:spin .6s var(--spring)}
@keyframes spin{from{transform:rotate(-200deg) scale(.5)}to{transform:none}}
.seg{display:flex;background:var(--surf);border-radius:999px;padding:4px;position:relative}
.seg button{flex:1;border:0;background:none;color:var(--on-v);font:600 15px inherit;font-family:inherit;padding:11px 0;border-radius:999px;cursor:pointer;position:relative;z-index:1;transition:color .3s}
.seg button.on{color:var(--on-pri)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--pri);border-radius:999px;transition:transform .5s var(--spring)}
.wrap{background:var(--surf);border-radius:36px;padding:10px;position:relative}
.wrap.shake{animation:shake .6s}
@keyframes shake{10%,90%{transform:translate(-3px,1px)}20%,80%{transform:translate(5px,-2px)}30%,50%,70%{transform:translate(-8px,2px)}40%,60%{transform:translate(8px,-1px)}}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:28px;touch-action:none}
.start{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.start span{background:var(--pri);color:var(--on-pri);padding:14px 26px;border-radius:999px;font-weight:700;font-size:16px;animation:float 1.6s var(--spring) infinite alternate}
.start.hide{display:none}
@keyframes float{from{transform:translateY(0) scale(1);border-radius:999px}to{transform:translateY(-8px) scale(1.06);border-radius:20px}}
.tools{display:flex;gap:10px}
.fab{flex:1;border:0;height:56px;border-radius:20px;background:var(--sec-c);color:var(--on-pri-c);font:700 16px inherit;font-family:inherit;cursor:pointer;transition:border-radius .45s var(--spring),transform .3s var(--spring)}
.fab:active{transform:scale(.94);border-radius:28px}
.ic{width:56px;height:56px;border:0;border-radius:50%;background:var(--surf);color:var(--on-v);font-size:22px;cursor:pointer;transition:border-radius .45s var(--spring),background .3s,transform .3s var(--spring)}
.ic.on{background:var(--pri-c);border-radius:20px;color:var(--on-pri-c)}
.ic:active{transform:scale(.88)}
.pad{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(2,72px);gap:8px;justify-content:center}
.pad button{border:0;background:var(--sec-c);color:var(--on-pri-c);font-size:26px;border-radius:26px;cursor:pointer;transition:border-radius .35s var(--spring),transform .25s var(--spring),background .2s}
.pad button:active{transform:scale(.86);border-radius:50%;background:var(--pri);color:var(--on-pri)}
.pad .u{grid-column:2}
.hint{margin:0 6px;text-align:center;color:var(--on-v);font-size:13px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;padding:24px;z-index:9;opacity:0}
.scrim.show{display:grid;animation:fade .3s forwards}
@keyframes fade{to{opacity:1}}
.dlg{background:var(--surf-lo);border-radius:36px;padding:28px 24px 20px;max-width:340px;width:100%;text-align:center;animation:dlg .6s var(--spring)}
@keyframes dlg{from{transform:scale(.6) translateY(40px);opacity:0}}
.dlg .big{font-size:56px;animation:spin .8s var(--spring)}
.dlg h2{margin:6px 0;font-size:26px}.dlg p{margin:0 0 20px;color:var(--on-v);line-height:1.5}
.dlg button{border:0;background:var(--pri);color:var(--on-pri);font:700 16px inherit;font-family:inherit;padding:14px 32px;border-radius:999px;cursor:pointer;transition:border-radius .4s var(--spring),transform .3s var(--spring)}
.dlg button:hover{border-radius:16px}.dlg button:active{transform:scale(.92)}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">
  <h1>贪吃蛇</h1>
  <div class="top">
    <div class="stat" id="score"><small>🍎</small><span>0</span></div>
    <button class="round" id="restart" aria-label="重新开始">🐍</button>
    <div class="stat t" id="best"><small>🏆</small><span>0</span></div>
  </div>
  <div class="seg" id="seg"><i></i><button data-l="0" class="on">悠闲</button><button data-l="1">标准</button><button data-l="2">极速</button></div>
  <div class="wrap" id="wrap"><canvas id="cv"></canvas><div class="start" id="start"><span>点按或滑动开始</span></div></div>
  <div class="tools">
    <button class="fab" id="pause">暂停</button>
    <button class="ic on" id="snd" aria-label="音效">🔊</button>
    <button class="ic on" id="vib" aria-label="振动">📳</button>
  </div>
  <div class="pad"><button class="u" data-d="0">▲</button><button data-d="3" style="grid-row:2">◀</button><button data-d="1" style="grid-row:2">▼</button><button data-d="2" style="grid-row:2">▶</button></div>
  <p class="hint">在棋盘上滑动、方向键、WASD 或下方按键控制 · 空格暂停</p>
</div>
<div class="scrim" id="scrim"><div class="dlg"><div class="big">💥</div><h2>游戏结束</h2><p id="dp"></p><button id="dbtn">再来一局</button></div></div>

<script>
const N=20,SPEED=[150,115,82],DIRS=[[0,-1],[0,1],[1,0],[-1,0]]; // 上 下 右 左
const $=s=>document.getElementById(s),cv=$('cv'),ctx=cv.getContext('2d');
let level=0,snake,prev,dir,queue,food,score,state='idle',acc=0,last=0,tick=150,parts=[],eatT=0,deadT=0,best=0,snd=true,vibOn=true;
try{snd=localStorage.getItem('sn-snd')!=='0';vibOn=localStorage.getItem('sn-vib')!=='0'}catch(e){}

/* ---------- 音效 / 振动 ---------- */
let ac;
function tone(f,d=.12,type='sine',v=.14,when=0,slide){
  if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),G=ac.createGain(),t=ac.currentTime+when;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  G.gain.setValueAtTime(v,t);G.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(G).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.5,v=.25){
  if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=ac.createBufferSource(),G=ac.createGain(),F=ac.createBiquadFilter();
  F.type='lowpass';F.frequency.setValueAtTime(1500,ac.currentTime);F.frequency.exponentialRampToValueAtTime(80,ac.currentTime+d);
  G.gain.value=v;s.buffer=b;s.connect(F).connect(G).connect(ac.destination);s.start()}catch(e){}}
const vib=p=>{if(vibOn&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}};
const sfx={
  eat:()=>{const f=520+Math.min(score,20)*28;tone(f,.09,'triangle',.14);tone(f*1.5,.12,'triangle',.12,.07)},
  turn:()=>tone(240,.04,'sine',.04),
  die:()=>{noise(.7,.3);tone(300,.6,'sawtooth',.16,0,50)},
  click:()=>tone(320,.06,'sine',.08),
  rec:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.12,.8+i*.09))
};

/* ---------- 游戏逻辑 ---------- */
const bestKey=()=>'sn-best-'+level;
function loadBest(){best=0;try{best=+localStorage.getItem(bestKey())||0}catch(e){}$('best').lastChild.textContent=best}
function reset(){
  snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];prev=snake.map(s=>({...s}));
  dir=2;queue=[];score=0;acc=0;parts=[];deadT=0;tick=SPEED[level];state='idle';
  spawn();$('score').lastChild.textContent=0;$('start').classList.remove('hide');$('pause').textContent='开始';
  const r=$('restart');r.classList.remove('spin');void r.offsetWidth;r.classList.add('spin');loadBest();
}
function spawn(){
  const free=[];for(let x=0;x<N;x++)for(let y=0;y<N;y++)if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});
  food=free[Math.random()*free.length|0];food.born=performance.now();
}
function run(){if(state==='idle'||state==='pause'){state='run';$('start').classList.add('hide');$('pause').textContent='暂停'}}
function pause(){if(state==='run'){state='pause';$('pause').textContent='继续'}}
function turn(d){
  if(state==='over')return;
  const ref=queue.length?queue[queue.length-1]:dir;
  if(d===ref||DIRS[d][0]+DIRS[ref][0]===0&&DIRS[d][1]+DIRS[ref][1]===0)return;
  if(queue.length<2){queue.push(d);sfx.turn();vib(6)}
  run();
}
function step(){
  if(queue.length)dir=queue.shift();
  prev=snake.map(s=>({...s}));
  const h={x:snake[0].x+DIRS[dir][0],y:snake[0].y+DIRS[dir][1]};
  const eat=h.x===food.x&&h.y===food.y;
  const body=eat?snake:snake.slice(0,-1);
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(s=>s.x===h.x&&s.y===h.y))return die();
  snake.unshift(h);if(!eat)snake.pop();
  if(eat){
    score++;eatT=performance.now();burst(food.x,food.y);sfx.eat();vib(18);
    const e=$('score');e.lastChild.textContent=score;e.classList.add('bump');setTimeout(()=>e.classList.remove('bump'),200);
    if(tick>55&&score%4===0)tick-=4;
    if(snake.length>=N*N)return die(true);
    spawn();
  }
}
function die(){
  state='over';deadT=performance.now();prev=snake.map(s=>({...s}));acc=0;
  sfx.die();vib([60,40,200]);
  const w=$('wrap');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');
  let rec=score>best&&score>0;
  if(rec){best=score;$('best').lastChild.textContent=best;try{localStorage.setItem(bestKey(),best)}catch(e){}}
  setTimeout(()=>{$('dp').textContent=`得分 ${score} · 最高 ${best}`+(rec?' · 新纪录!':'');$('scrim').classList.add('show');if(rec){sfx.rec();vib([30,50,30,50,100])}},900);
  $('pause').textContent='已结束';
}
function burst(x,y){for(let i=0;i<14;i++){const a=Math.random()*6.28,s=.004+Math.random()*.008;parts.push({x:x+.5,y:y+.5,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h:Math.random()*70+300})}}

/* ---------- 绘制 ---------- */
function fit(){const w=cv.clientWidth,d=window.devicePixelRatio||1;cv.width=cv.height=Math.round(w*d)}
const dark=matchMedia('(prefers-color-scheme:dark)');
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':dark.matches}
function draw(){
  const S=cv.width,c=S/N,cs=getComputedStyle(document.documentElement),now=performance.now();
  ctx.clearRect(0,0,S,S);
  ctx.strokeStyle=cs.getPropertyValue('--on-v').trim();ctx.globalAlpha=.08;ctx.lineWidth=Math.max(1,c*.04);
  for(let x=0;x<N;x++)for(let y=0;y<N;y++){ctx.beginPath();ctx.roundRect(x*c+c*.08,y*c+c*.08,c*.84,c*.84,c*.28);ctx.stroke()}
  ctx.globalAlpha=1;
  // 食物:圆形 + 外环
  const age=Math.min(1,(now-food.born)/350),sc=1-Math.pow(1-age,3),pl=Math.sin(now/220),fx=(food.x+.5)*c,fy=(food.y+.5)*c;
  const fc=isDark()?'#ffb4ab':'#e8467c';ctx.fillStyle=fc;ctx.beginPath();ctx.arc(fx,fy,c*(.28+.03*pl)*sc,0,6.283);ctx.fill();
  ctx.strokeStyle=fc;ctx.globalAlpha=.45;ctx.lineWidth=c*.07;ctx.beginPath();ctx.arc(fx,fy,c*(.42+.04*pl)*sc,0,6.283);ctx.stroke();ctx.globalAlpha=1;
  // 蛇
  const t=state==='run'?Math.min(1,acc/tick):1,L=snake.length,P=[];
  for(let i=0;i<L;i++){const a=prev[Math.min(i,prev.length-1)],b=snake[i],k=state==='over'?1:t;P.push({x:(a.x+(b.x-a.x)*k+.5)*c,y:(a.y+(b.y-a.y)*k+.5)*c})}
  const dead=state==='over',flash=dead&&Math.floor((now-deadT)/110)%2===0,dk=isDark();
  const col=i=>flash?cs.getPropertyValue('--err').trim():`hsl(${262+i/Math.max(L-1,1)*72} ${dk?70:58}% ${dk?72-i/L*14:46+i/L*8}%)`;
  const grow=1+Math.max(0,.22*Math.sin(Math.min(1,(now-eatT)/300)*Math.PI));
  for(let i=L-1;i>0;i--){const z=c*(.8-.16*i/L);ctx.fillStyle=col(i);ctx.beginPath();ctx.roundRect(P[i].x-z/2,P[i].y-z/2,z,z,z*.3);ctx.fill()}
  const H=P[0],hr=c*.46*grow;ctx.fillStyle=col(0);ctx.beginPath();ctx.arc(H.x,H.y,hr,0,6.283);ctx.fill();
  // 粒子
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=`hsl(${p.h} 80% 62%)`;ctx.beginPath();ctx.arc(p.x*c,p.y*c,c*.12*p.l+1,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;
}
function frame(ts){
  const dt=Math.min(50,ts-(last||ts));last=ts;
  if(state==='run'){acc+=dt;while(acc>=tick&&state==='run'){acc-=tick;step()}}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt/600}parts=parts.filter(p=>p.l>0);
  draw();requestAnimationFrame(frame);
}

/* ---------- 输入 ---------- */
addEventListener('keydown',e=>{
  const m={ArrowUp:0,w:0,W:0,ArrowDown:1,s:1,S:1,ArrowRight:2,d:2,D:2,ArrowLeft:3,a:3,A:3}[e.key];
  if(m!==undefined){e.preventDefault();turn(m)}
  else if(e.key===' '){e.preventDefault();state==='run'?pause():(state==='over'?0:run())}
});
let sw=null;
cv.addEventListener('pointerdown',e=>{sw={x:e.clientX,y:e.clientY};if(state==='idle'||state==='pause')run()});
cv.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(Math.hypot(dx,dy)>22){turn(Math.abs(dx)>Math.abs(dy)?(dx>0?2:3):(dy>0?1:0));sw={x:e.clientX,y:e.clientY}}
});
const endSw=()=>sw=null;cv.addEventListener('pointerup',endSw);cv.addEventListener('pointercancel',endSw);
document.querySelectorAll('.pad button').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();turn(+b.dataset.d)}));
$('pause').onclick=()=>{sfx.click();vib(10);state==='run'?pause():state==='over'?reset():run()};
$('restart').onclick=()=>{sfx.click();vib(15);$('scrim').classList.remove('show');reset()};
$('dbtn').onclick=()=>{$('scrim').classList.remove('show');sfx.click();reset()};
function setT(id,on,a,b){const e=$(id);e.classList.toggle('on',on);e.textContent=on?a:b}
$('snd').onclick=()=>{snd=!snd;setT('snd',snd,'🔊','🔇');try{localStorage.setItem('sn-snd',snd?1:0)}catch(e){}sfx.click()};
$('vib').onclick=()=>{vibOn=!vibOn;setT('vib',vibOn,'📳','📴');try{localStorage.setItem('sn-vib',vibOn?1:0)}catch(e){}vib(30)};
document.querySelectorAll('#seg button').forEach((b,k)=>b.onclick=()=>{
  level=k;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelector('#seg i').style.transform=`translateX(${k*100}%)`;sfx.click();vib(12);$('scrim').classList.remove('show');reset();
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
addEventListener('resize',fit);
setT('snd',snd,'🔊','🔇');setT('vib',vibOn,'📳','📴');
fit();reset();requestAnimationFrame(frame);
</script>
</body>
</html>
