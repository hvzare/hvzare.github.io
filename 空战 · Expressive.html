<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空战 · Expressive</title>
<style>
:root{
  --bg:#fef7ff;--surf:#f3edf7;--surf-hi:#e6e0e9;--surf-lo:#f7f2fa;--on:#1d1b20;--on-v:#49454f;
  --pri:#6750a4;--on-pri:#fff;--pri-c:#eaddff;--on-pri-c:#21005d;
  --sec-c:#e8def8;--ter-c:#ffd8e4;--on-ter-c:#31111d;
  --spring:cubic-bezier(.34,1.56,.64,1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141218;--surf:#211f26;--surf-hi:#2b2930;--surf-lo:#26242b;--on:#e6e0e9;--on-v:#cac4d0;
  --pri:#d0bcff;--on-pri:#381e72;--pri-c:#4f378b;--on-pri-c:#eaddff;--sec-c:#4a4458;--ter-c:#633b48;--on-ter-c:#ffd8e4}}
:root[data-theme="dark"]{
  --bg:#141218;--surf:#211f26;--surf-hi:#2b2930;--surf-lo:#26242b;--on:#e6e0e9;--on-v:#cac4d0;
  --pri:#d0bcff;--on-pri:#381e72;--pri-c:#4f378b;--on-pri-c:#eaddff;--sec-c:#4a4458;--ter-c:#633b48;--on-ter-c:#ffd8e4}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--on);font-family:"Google Sans Flex","Google Sans","Segoe UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;min-height:100%;display:flex;justify-content:center}
.app{width:100%;max-width:500px;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
h1{margin:6px 4px 0;font-size:30px;font-weight:700;letter-spacing:-.5px}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.stat{background:var(--pri-c);color:var(--on-pri-c);border-radius:28px;padding:10px 16px;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;gap:8px;justify-content:center;align-items:center;transition:transform .3s var(--spring)}
.stat.t{background:var(--ter-c);color:var(--on-ter-c)}
.stat small{font-size:18px}.stat.bump{transform:scale(1.12)}
.round{width:68px;height:68px;border:0;font-size:30px;background:var(--pri);color:var(--on-pri);border-radius:50%;cursor:pointer;transition:border-radius .5s var(--spring),transform .4s var(--spring);display:grid;place-items:center}
.round:hover{border-radius:30%}.round:active{transform:scale(.88);border-radius:42%}
.spin{animation:spin .6s var(--spring)}
@keyframes spin{from{transform:rotate(-200deg) scale(.5)}to{transform:none}}
.wrap{background:var(--surf);border-radius:36px;padding:10px;position:relative}
.wrap.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translate(-3px,1px)}20%,80%{transform:translate(5px,-2px)}30%,50%,70%{transform:translate(-8px,2px)}40%,60%{transform:translate(8px,-1px)}}
canvas{display:block;width:100%;aspect-ratio:9/13;border-radius:28px;touch-action:none;cursor:none}
.start{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.start span{background:var(--pri);color:var(--on-pri);padding:14px 26px;border-radius:999px;font-weight:700;font-size:16px;animation:float 1.6s var(--spring) infinite alternate}
.start.hide{display:none}
@keyframes float{from{transform:translateY(0) scale(1);border-radius:999px}to{transform:translateY(-8px) scale(1.06);border-radius:20px}}
.tools{display:flex;gap:10px}
.fab{flex:1;border:0;height:56px;border-radius:20px;background:var(--sec-c);color:var(--on-pri-c);font:700 16px inherit;font-family:inherit;cursor:pointer;transition:border-radius .45s var(--spring),transform .3s var(--spring)}
.fab:active{transform:scale(.94);border-radius:28px}
.ic{width:56px;height:56px;border:0;border-radius:50%;background:var(--surf);color:var(--on-v);font-size:22px;cursor:pointer;transition:border-radius .45s var(--spring),background .3s,transform .3s var(--spring)}
.ic.on{background:var(--pri-c);border-radius:20px;color:var(--on-pri-c)}
.ic:active{transform:scale(.88)}
.hint{margin:0 6px;text-align:center;color:var(--on-v);font-size:13px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;padding:24px;z-index:9;opacity:0}
.scrim.show{display:grid;animation:fade .3s forwards}
@keyframes fade{to{opacity:1}}
.dlg{background:var(--surf-lo);border-radius:36px;padding:28px 24px 20px;max-width:340px;width:100%;text-align:center;animation:dlg .6s var(--spring)}
@keyframes dlg{from{transform:scale(.6) translateY(40px);opacity:0}}
.dlg .big{font-size:56px;animation:spin .8s var(--spring)}
.dlg h2{margin:6px 0;font-size:26px}.dlg p{margin:0 0 20px;color:var(--on-v);line-height:1.5}
.dlg button{border:0;background:var(--pri);color:var(--on-pri);font:700 16px inherit;font-family:inherit;padding:14px 32px;border-radius:999px;cursor:pointer;transition:border-radius .4s var(--spring),transform .3s var(--spring)}
.dlg button:hover{border-radius:16px}.dlg button:active{transform:scale(.92)}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">
  <h1>空战</h1>
  <div class="top">
    <div class="stat" id="score"><small>⭐</small><span>0</span></div>
    <button class="round" id="restart" aria-label="重新开始">↻</button>
    <div class="stat t" id="best"><small>🏆</small><span>0</span></div>
  </div>
  <div class="wrap"><canvas id="cv"></canvas><div class="start" id="start"><span id="stxt">按住并拖动飞机 · 自动开火</span></div></div>
  <div class="tools">
    <button class="fab" id="pause">暂停</button>
    <button class="ic on" id="snd" aria-label="音效">🔊</button>
    <button class="ic on" id="vib" aria-label="振动">📳</button>
  </div>
  <p class="hint">拖动屏幕或用方向键 / WASD 移动，飞机自动开火 · 拾取 ⭐ 升级武器 · 得分越高越难 · 每隔一段时间会出现 BOSS</p>
</div>
<div class="scrim" id="scrim"><div class="dlg"><div class="big">💥</div><h2>游戏结束</h2><p id="dp"></p><button id="dbtn">再来一局</button></div></div>

<script>
const $=s=>document.getElementById(s),cv=$('cv'),ctx=cv.getContext('2d');
const W=360,H=520;
let bossN=0,bossAt=500,boss=null,warn=0,banner=null,st='idle',P,bl,eb,en,pw,parts,rings,bgs,score,best,hp,wl,t,sp,fireT,shake,last=0,alt=0,lastK=0,lastE=0,snd=true,vibOn=true,tgt=null,keys={};
try{snd=localStorage.getItem('a-snd')!=='0';vibOn=localStorage.getItem('a-vib')!=='0'}catch(e){}
const dark=()=>{const q=document.documentElement.dataset.theme;return q?q==='dark':matchMedia('(prefers-color-scheme:dark)').matches};

/* 音效 / 振动 */
let ac;
const A=()=>ac=ac||new(window.AudioContext||window.webkitAudioContext)();
function tone(f,d=.12,type='sine',v=.13,when=0,slide){
  if(!snd)return;try{const a=A(),o=a.createOscillator(),G=a.createGain(),q=a.currentTime+when;
  o.type=type;o.frequency.setValueAtTime(f,q);if(slide)o.frequency.exponentialRampToValueAtTime(slide,q+d);
  G.gain.setValueAtTime(.0001,q);G.gain.linearRampToValueAtTime(v,q+.004);G.gain.exponentialRampToValueAtTime(.001,q+d);
  o.connect(G).connect(a.destination);o.start(q);o.stop(q+d+.02)}catch(e){}}
function noise(d=.3,v=.2){
  if(!snd)return;try{const a=A(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=a.createBufferSource(),G=a.createGain(),F=a.createBiquadFilter();
  F.type='lowpass';F.frequency.setValueAtTime(1600,a.currentTime);F.frequency.exponentialRampToValueAtTime(100,a.currentTime+d);
  G.gain.value=v;s.buffer=b;s.connect(F).connect(G).connect(a.destination);s.start()}catch(e){}}
const bell=(f,when=0,v=.14)=>{tone(f,.36,'sine',v,when);tone(f*2.76,.16,'sine',v*.3,when);tone(f*5.4,.07,'sine',v*.12,when)};
const vib=q=>{if(vibOn&&navigator.vibrate){try{navigator.vibrate(q)}catch(e){}}};
const sfx={
  shot:()=>{if(alt++%2===0)tone(1500+Math.random()*250,.025,'square',.014)},
  boom:big=>{const n=performance.now();if(n-lastE<60)return;lastE=n;noise(big?.5:.25,big?.28:.16);tone(big?160:260,.25,'sawtooth',.06,0,50)},
  hit:()=>{noise(.4,.3);tone(180,.4,'sawtooth',.14,0,45)},
  up:()=>[0,4,7,12].forEach((x,i)=>bell(659*Math.pow(2,x/12),i*.07,.12)),
  heal:()=>[0,7].forEach((x,i)=>bell(784*Math.pow(2,x/12),i*.09,.12)),
  die:()=>{noise(.9,.35);[0,-4,-8,-12].forEach((x,i)=>bell(440*Math.pow(2,x/12),.2+i*.13,.1))},
  warn:()=>[0,1,2,3].forEach(i=>tone(i%2?330:440,.22,'square',.07,i*.28)),
  click:()=>tone(1800,.03,'sine',.06)
};

/* 游戏逻辑 */
const diff=()=>Math.min(1,score/1800);
function reset(){
  P={x:W/2,y:H-90,inv:0};bl=[];eb=[];en=[];pw=[];parts=[];rings=[];score=0;hp=3;wl=1;t=0;sp=1;fireT=0;shake=0;tgt=null;bossN=0;bossAt=500;boss=null;warn=0;banner=null;
  bgs=Array.from({length:14},()=>({x:Math.random()*W,y:Math.random()*H,w:24+Math.random()*60,h:24+Math.random()*60,v:20+Math.random()*50}));
  best=0;try{best=+localStorage.getItem('a-best')||0}catch(e){}
  $('score').lastChild.textContent=0;$('best').lastChild.textContent=best;
  st='idle';$('stxt').textContent='按住并拖动飞机 · 自动开火';$('start').classList.remove('hide');$('pause').textContent='开始';
  const r=$('restart');r.classList.remove('spin');void r.offsetWidth;r.classList.add('spin');
}
function run(){if(st==='idle'||st==='pause'){st='play';$('start').classList.add('hide');$('pause').textContent='暂停'}}
function pauseG(){if(st==='play'){st='pause';$('stxt').textContent='已暂停 · 点按继续';$('start').classList.remove('hide');$('pause').textContent='继续'}}
function spawn(){
  const d=diff(),r=Math.random();let e;
  if(d>.25&&r<.1+.1*d)e={k:'C',r:28,hp:10,vy:45+40*d,sc:60,h:30,sh:1.9-.6*d,sd:Math.random()<.5?4:0};
  else if(d>.06&&r<.4)e={k:'B',r:20,hp:3,vy:70+80*d,sc:25,h:200,sh:1.7-.7*d,sd:d>.2&&Math.random()<.3?2:0};
  else e={k:'A',r:14,hp:1,vy:90+120*d,sc:10,h:340,sh:d>.35&&Math.random()<.35?2.4-.6*d:0,sd:d>.45&&Math.random()<.2?1:0};
  e.x0=e.r+10+Math.random()*(W-2*e.r-20);e.x=e.x0;e.y=-e.r;e.ph=Math.random()*6;e.amp=e.k==='A'?30+Math.random()*30:12;e.hit=0;e.st=e.sh*Math.random()+.4;
  en.push(e);
}
function spawnBoss(){
  bossN++;const hp=60+30*bossN;boss={x:W/2,y:-70,r:52,hp,max:hp,t:0,dir:1,a1:1.5,a2:3,a3:0,spin:0,hit:0,sd:0,s2:0};bossAt=Infinity;
}
function killBoss(){
  const B=boss;score+=300*bossN;setScore();
  for(let i=0;i<7;i++)setTimeout(()=>{burst(B.x+(Math.random()-.5)*100,B.y+(Math.random()-.5)*50,[280,340,30,48][i%4],18,30);sfx.boom(true);vib(40)},i*130);
  pw.push({x:B.x-20,y:B.y,k:'w'},{x:B.x+20,y:B.y,k:'h'});eb=[];boss=null;bossAt=score+900;
  banner={s:'BOSS 击破!',t:2,c:48};setTimeout(sfx.up,500);
}
function shoot(e){
  const d=diff(),v=170+90*d;
  if(e.k==='B')eb.push({x:e.x,y:e.y+e.r,vx:0,vy:v});
  else if(e.k==='A'){const a=Math.atan2(P.y-e.y,P.x-e.x);eb.push({x:e.x,y:e.y+e.r,vx:Math.cos(a)*v*.9,vy:Math.sin(a)*v*.9})}
  else{const a=Math.atan2(P.y-e.y,P.x-e.x);for(const o of[-.28,0,.28])eb.push({x:e.x,y:e.y+e.r,vx:Math.cos(a+o)*v,vy:Math.sin(a+o)*v})}
}
function fire(){
  const x=P.x,y=P.y-24,add=(dx,vx)=>bl.push({x:x+dx,y,vx,vy:-640});
  if(wl===1)add(0,0);else if(wl===2){add(-8,0);add(8,0)}else{add(0,0);add(-11,-90);add(11,90)}
  sfx.shot();
}
function burst(x,y,h,n,r){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=60+Math.random()*180;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,h})}
  rings.push({x,y,r,t:0,h});
}
function setScore(){const e=$('score');e.lastChild.textContent=score;e.classList.add('bump');setTimeout(()=>e.classList.remove('bump'),180)}
function kill(e){
  score+=e.sc;setScore();burst(e.x,e.y,e.h,e.k==='C'?22:12,e.r);sfx.boom(e.k!=='A');
  const n=performance.now();if(n-lastK>120||e.k!=='A'){lastK=n;vib(e.k==='A'?10:[30,20,40])}
  if(Math.random()<(e.k==='C'?.6:e.k==='B'?.14:.07))pw.push({x:e.x,y:e.y,k:Math.random()<.35&&hp<3?'h':'w'});
}
function hurt(){
  if(P.inv>0||st!=='play')return;
  hp--;P.inv=1.5;wl=Math.max(1,wl-1);shake=.35;sfx.hit();vib([60,30,100]);
  const w=cv.parentNode;w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');
  burst(P.x,P.y,10,10,16);
  if(hp<=0){
    st='over';burst(P.x,P.y,30,30,40);burst(P.x,P.y,340,20,26);sfx.die();vib([100,60,300]);
    const rec=score>best&&score>0;
    if(rec){best=score;$('best').lastChild.textContent=best;try{localStorage.setItem('a-best',best)}catch(e){}}
    setTimeout(()=>{$('dp').textContent=`得分 ${score} · 最高 ${best}`+(rec?' · 新纪录!':'');$('scrim').classList.add('show')},1100);
  }
}
const hit2=(a,b,r)=>(a.x-b.x)**2+(a.y-b.y)**2<r*r;
function update(dt){
  for(const b of bgs){b.y+=b.v*dt*(st==='play'?1:.3);if(b.y>H+80){b.y=-80;b.x=Math.random()*W}}
  for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.98;q.vy*=.98;q.l-=dt*1.5}parts=parts.filter(q=>q.l>0);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
  rings.forEach(q=>q.t+=dt);rings=rings.filter(q=>q.t<.5);shake=Math.max(0,shake-dt);
  if(st==='over'){en.forEach(e=>e.y+=e.vy*dt*.4);return}
  if(st!=='play'){return}
  t+=dt;P.inv=Math.max(0,P.inv-dt);
  // 移动
  let kx=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0),ky=(keys.ArrowDown||keys.s||keys.S?1:0)-(keys.ArrowUp||keys.w||keys.W?1:0);
  if(kx||ky){P.x+=kx*280*dt;P.y+=ky*280*dt;tgt=null}
  else if(tgt){const k=Math.min(1,dt*16);P.x+=(tgt.x-P.x)*k;P.y+=(tgt.y-P.y)*k}
  P.x=Math.max(20,Math.min(W-20,P.x));P.y=Math.max(60,Math.min(H-30,P.y));
  fireT-=dt;if(fireT<=0){fire();fireT=.16}
  sp-=dt;if(sp<=0){spawn();sp=(Math.max(.34,1.05-.7*diff())+Math.random()*.25)*(boss?2.2:1)}
  bl.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});bl=bl.filter(b=>b.y>-20&&b.x>-10&&b.x<W+10);
  eb.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt});eb=eb.filter(b=>b.y<H+20&&b.y>-20&&b.x>-20&&b.x<W+20);
  for(const e of en){
    e.y+=e.vy*dt;e.ph+=dt*2;e.x=e.x0+Math.sin(e.ph)*e.amp;e.hit=Math.max(0,e.hit-dt);
    if(e.sh&&e.y>20&&e.y<H-120){e.st-=dt;if(e.st<=0){shoot(e);e.st=e.sh}}
    for(const b of bl){if(!b.dead&&hit2(b,e,e.r+(e.sd>0?12:5))){b.dead=1;e.hit=.08;
      if(e.sd>0){e.sd--;tone(1300,.07,'sine',.05);if(e.sd===0){rings.push({x:e.x,y:e.y,r:e.r+6,t:0,h:190});tone(900,.12,'triangle',.07,0,400)}}
      else{e.hp--;if(e.hp<=0){e.dead=1;kill(e);break}else tone(700+Math.random()*100,.03,'triangle',.03)}}}
    if(!e.dead&&hit2(P,e,e.r+11)){e.dead=1;kill(e);hurt()}
  }
  en=en.filter(e=>!e.dead&&e.y<H+40);bl=bl.filter(b=>!b.dead);
  if(!boss&&!warn&&score>=bossAt){warn=2.2;banner={s:'⚠ WARNING',t:2.2,c:350,flash:1};sfx.warn();vib([100,80,100,80,200])}
  if(warn>0){warn-=dt;if(warn<=0){warn=0;spawnBoss()}}
  if(boss){
    const B=boss,en2=B.hp<B.max*.5;B.t+=dt;B.hit=Math.max(0,B.hit-dt);
    if(B.y<95)B.y+=70*dt;
    else{
      B.x+=B.dir*(en2?120:75)*dt;if(B.x>W-70){B.x=W-70;B.dir=-1}if(B.x<70){B.x=70;B.dir=1}
      B.a1-=dt;B.a2-=dt;B.a3-=dt;
      if(B.a1<=0){B.a1=en2?1.1:1.7;const a0=Math.atan2(P.y-B.y,P.x-B.x);for(let i=-2;i<=2;i++)eb.push({x:B.x,y:B.y+30,vx:Math.cos(a0+i*.26)*190,vy:Math.sin(a0+i*.26)*190});tone(220,.15,'square',.04,0,120)}
      if(B.a2<=0){B.a2=en2?2.6:3.6;for(let i=0;i<16;i++){const a=i/16*6.283+B.t;eb.push({x:B.x,y:B.y,vx:Math.cos(a)*140,vy:Math.sin(a)*140})}tone(160,.25,'sawtooth',.05,0,80)}
      if(en2&&B.a3<=0){B.a3=.13;B.spin+=.55;eb.push({x:B.x,y:B.y+20,vx:Math.cos(B.spin)*150,vy:Math.abs(Math.sin(B.spin))*150+60})}
    }
    if(!B.s2&&B.hp<B.max*.5){B.s2=1;B.sd=10;banner={s:'护盾展开',t:1.2,c:190};sfx.up()}
    for(const b of bl)if(!b.dead&&B.y>60&&hit2(b,B,B.r+8)){
      b.dead=1;B.hit=.06;
      if(B.sd>0){B.sd--;tone(1200,.06,'sine',.05)}
      else{B.hp--;if(B.hp<=0){killBoss();break}else if(alt++%3===0)tone(500,.03,'triangle',.03)}
    }
    if(boss&&hit2(P,boss,boss.r+11))hurt();
    bl=bl.filter(b=>!b.dead);
  }
  for(const b of eb)if(hit2(b,P,15)){b.dead=1;hurt()}
  eb=eb.filter(b=>!b.dead);
  for(const o of pw){o.y+=70*dt;if(hit2(o,P,26)){o.dead=1;
    if(o.k==='w'){if(wl<3){wl++;sfx.up()}else{score+=50;setScore();sfx.heal()}}else{hp=Math.min(3,hp+1);sfx.heal()}
    vib([20,30,30]);rings.push({x:o.x,y:o.y,r:14,t:0,h:48})}}
  pw=pw.filter(o=>!o.dead&&o.y<H+20);
}
/* 绘制 */
function draw(now){
  const k=cv.width/W,cs=getComputedStyle(document.documentElement),dk=dark(),pri=cs.getPropertyValue('--pri').trim(),onp=cs.getPropertyValue('--on-pri').trim(),onv=cs.getPropertyValue('--on-v').trim();
  ctx.setTransform(k,0,0,k,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();if(shake>0)ctx.translate((Math.random()-.5)*10*shake*3,(Math.random()-.5)*10*shake*3);
  ctx.strokeStyle=onv;ctx.lineWidth=2;ctx.globalAlpha=.1;
  for(const b of bgs){ctx.beginPath();ctx.roundRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h,b.w*.3);ctx.stroke()}
  ctx.globalAlpha=1;
  const L=dk?66:56,S=dk?45:50;
  for(const e of en){
    const c=`hsl(${e.h} ${S}% ${e.hit>0?(dk?90:85):L}%)`;ctx.fillStyle=c;
    if(e.k==='A'){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.283);ctx.fill();ctx.strokeStyle=dk?'#141218':'#fff';ctx.globalAlpha=.6;ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r*.45,0,6.283);ctx.stroke();ctx.globalAlpha=1}
    else{const w=e.r*2,h=e.k==='C'?e.r*1.7:e.r*1.5;ctx.beginPath();ctx.roundRect(e.x-w/2,e.y-h/2,w,h,w*.3);ctx.fill();
      ctx.fillStyle=dk?'#141218':'#fff';ctx.globalAlpha=.65;ctx.beginPath();ctx.arc(e.x,e.y,e.r*.34,0,6.283);ctx.fill();
      if(e.k==='C'){ctx.beginPath();ctx.arc(e.x-e.r*.62,e.y+e.r*.35,e.r*.16,0,6.283);ctx.arc(e.x+e.r*.62,e.y+e.r*.35,e.r*.16,0,6.283);ctx.fill()}ctx.globalAlpha=1}
  }
  for(const e of en)if(e.sd>0){ctx.strokeStyle=`hsl(190 70% ${dk?68:50}%)`;ctx.globalAlpha=.7+.25*Math.sin(now/120);ctx.lineWidth=2+Math.min(3,e.sd);ctx.beginPath();ctx.arc(e.x,e.y,e.r+7,0,6.283);ctx.stroke();ctx.globalAlpha=1}
  if(boss){
    const B=boss,f=B.hit>0;
    ctx.fillStyle=`hsl(280 ${dk?38:42}% ${f?(dk?88:84):(dk?64:52)}%)`;
    ctx.beginPath();ctx.roundRect(B.x-62,B.y-30,124,60,26);ctx.fill();
    ctx.beginPath();ctx.roundRect(B.x-80,B.y-14,26,50,13);ctx.fill();
    ctx.beginPath();ctx.roundRect(B.x+54,B.y-14,26,50,13);ctx.fill();
    ctx.beginPath();ctx.roundRect(B.x-34,B.y+26,16,18,7);ctx.fill();
    ctx.beginPath();ctx.roundRect(B.x+18,B.y+26,16,18,7);ctx.fill();
    ctx.fillStyle=dk?'#141218':'#fff';ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(B.x,B.y,14,0,6.283);ctx.fill();ctx.globalAlpha=1;
    ctx.strokeStyle=`hsl(350 70% ${dk?70:58}%)`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(B.x,B.y,19+Math.sin(now/150)*2,0,6.283);ctx.stroke();
    if(B.sd>0){ctx.strokeStyle=`hsl(190 70% ${dk?68:50}%)`;ctx.globalAlpha=.7+.25*Math.sin(now/120);ctx.lineWidth=4;ctx.beginPath();ctx.ellipse(B.x,B.y+4,90,56,0,0,6.283);ctx.stroke();ctx.globalAlpha=1}
  }
  for(const o of pw){ctx.fillStyle=o.k==='w'?`hsl(48 70% ${dk?62:58}%)`:`hsl(350 65% ${dk?70:62}%)`;ctx.beginPath();ctx.roundRect(o.x-13,o.y-13+Math.sin(now/200)*2,26,26,o.k==='w'?9:13);ctx.fill();
    ctx.font='16px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(o.k==='w'?'⭐':'❤️',o.x,o.y+Math.sin(now/200)*2+1)}
  ctx.fillStyle=pri;for(const b of bl){ctx.beginPath();ctx.roundRect(b.x-2.5,b.y-8,5,16,2.5);ctx.fill()}
  ctx.strokeStyle=`hsl(350 60% ${dk?68:55}%)`;ctx.lineWidth=3;for(const b of eb){ctx.beginPath();ctx.arc(b.x,b.y,5,0,6.283);ctx.stroke()}
  for(const r of rings){ctx.strokeStyle=`hsl(${r.h} 60% ${dk?70:55}%)`;ctx.globalAlpha=1-r.t/.5;ctx.lineWidth=3;ctx.beginPath();ctx.arc(r.x,r.y,r.r+r.t*90,0,6.283);ctx.stroke()}
  ctx.globalAlpha=1;
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.l);ctx.fillStyle=`hsl(${q.h} 60% 64%)`;ctx.beginPath();ctx.arc(q.x,q.y,4*q.l+1,0,6.283);ctx.fill()}
  ctx.globalAlpha=1;
  if(st!=='over'&&!(P.inv>0&&Math.floor(now/80)%2)){ // 飞机:圆角矩形机身 + 机翼 + 圆形座舱
    const x=P.x,y=P.y,fl=Math.random()*6;
    ctx.lineJoin='round';
    for(const sd of[-7,7]){ // 双引擎尾焰
      ctx.fillStyle='hsl(28 90% 60%)';ctx.beginPath();ctx.moveTo(x+sd-3.5,y+22);ctx.quadraticCurveTo(x+sd,y+36+fl,x+sd+3.5,y+22);ctx.fill();
      ctx.fillStyle='hsl(48 95% 78%)';ctx.beginPath();ctx.moveTo(x+sd-1.8,y+22);ctx.quadraticCurveTo(x+sd,y+29+fl*.6,x+sd+1.8,y+22);ctx.fill();
    }
    ctx.fillStyle=pri;ctx.strokeStyle=pri;ctx.lineWidth=5;
    for(const m of[-1,1]){ // 后掠主翼 + 尾翼(描边圆角)
      ctx.globalAlpha=.78;
      ctx.beginPath();ctx.moveTo(x+m*6,y-6);ctx.lineTo(x+m*27,y+17);ctx.lineTo(x+m*27,y+23);ctx.lineTo(x+m*6,y+15);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(x+m*6,y+14);ctx.lineTo(x+m*14,y+23);ctx.lineTo(x+m*14,y+26);ctx.lineTo(x+m*6,y+25);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.beginPath();ctx.moveTo(x,y-30);ctx.quadraticCurveTo(x+10,y-13,x+8,y+8);ctx.lineTo(x+8,y+21);ctx.quadraticCurveTo(x+8,y+26,x+3,y+26);ctx.lineTo(x-3,y+26);ctx.quadraticCurveTo(x-8,y+26,x-8,y+21);ctx.lineTo(x-8,y+8);ctx.quadraticCurveTo(x-10,y-13,x,y-30);ctx.fill();
    ctx.fillStyle=onp;ctx.globalAlpha=.92;ctx.beginPath();ctx.ellipse(x,y-9,3.8,8,0,0,6.283);ctx.fill();
    ctx.beginPath();ctx.arc(x-27,y+20,2.3,0,6.283);ctx.arc(x+27,y+20,2.3,0,6.283);ctx.fill();ctx.globalAlpha=1;
  }
  ctx.restore();
  // HUD:生命(胶囊) + 武器等级(圆点)
  for(let i=0;i<3;i++){ctx.beginPath();ctx.roundRect(12+i*22,12,18,9,4.5);if(i<hp){ctx.fillStyle=`hsl(350 65% ${dk?70:60}%)`;ctx.fill()}else{ctx.strokeStyle=onv;ctx.globalAlpha=.35;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1}}
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(W-18-i*16,17,5,0,6.283);if(i<wl){ctx.fillStyle=pri;ctx.fill()}else{ctx.strokeStyle=onv;ctx.globalAlpha=.35;ctx.lineWidth=2;ctx.stroke();ctx.globalAlpha=1}}
}
function hudTop(now){
  const dk=dark(),cs=getComputedStyle(document.documentElement),onv=cs.getPropertyValue('--on-v').trim();
  if(boss){const w=130,x=W/2-w/2;ctx.strokeStyle=onv;ctx.globalAlpha=.4;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(x,12,w,10,5);ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle=`hsl(350 65% ${dk?68:58}%)`;ctx.beginPath();ctx.roundRect(x+1,13,Math.max(8,(w-2)*boss.hp/boss.max),8,4);ctx.fill()}
  if(banner){ctx.save();ctx.globalAlpha=Math.min(1,banner.t*2)*(banner.flash?(.55+.45*Math.sin(now/70)):1);
    ctx.fillStyle=`hsl(${banner.c} 70% ${dk?72:50}%)`;ctx.font='800 34px "Google Sans","PingFang SC",system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(banner.s,W/2,H*.38);ctx.restore()}
}
function frame(ts){const dt=Math.min(.04,(ts-(last||ts))/1000);last=ts;update(dt);draw(ts);hudTop(ts);requestAnimationFrame(frame)}
function fit(){const d=window.devicePixelRatio||1;cv.width=Math.round(cv.clientWidth*d);cv.height=Math.round(cv.clientHeight*d)}

/* 输入 */
function pt(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
let drag=false;
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);if(st==='idle'||st==='pause')run();drag=true;const q=pt(e);tgt={x:q.x,y:q.y-(e.pointerType==='mouse'?0:60)}});
cv.addEventListener('pointermove',e=>{if(!drag&&e.pointerType!=='mouse')return;const q=pt(e);tgt={x:q.x,y:q.y-(e.pointerType==='mouse'?0:60)}});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>drag=false));
addEventListener('keydown',e=>{keys[e.key]=1;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if((e.key===' '||e.key.startsWith('Arrow')||'wasdWASD'.includes(e.key))&&(st==='idle'||st==='pause'))run();if(e.key===' '&&st==='play')pauseG()});
addEventListener('keyup',e=>keys[e.key]=0);
const again=()=>{$('scrim').classList.remove('show');sfx.click();vib(20);reset()};
$('restart').onclick=again;$('dbtn').onclick=again;
$('pause').onclick=()=>{sfx.click();vib(10);st==='play'?pauseG():st==='over'?again():run()};
function setT(id,on,a,b){const e=$(id);e.classList.toggle('on',on);e.textContent=on?a:b}
$('snd').onclick=()=>{snd=!snd;setT('snd',snd,'🔊','🔇');try{localStorage.setItem('a-snd',snd?1:0)}catch(e){}sfx.click()};
$('vib').onclick=()=>{vibOn=!vibOn;setT('vib',vibOn,'📳','📴');try{localStorage.setItem('a-vib',vibOn?1:0)}catch(e){}vib(50)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseG()});
addEventListener('resize',fit);
setT('snd',snd,'🔊','🔇');setT('vib',vibOn,'📳','📴');
fit();reset();requestAnimationFrame(frame);
</script>
</body>
