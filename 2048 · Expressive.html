<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2048 · Expressive</title>
<style>
:root{
  --bg:#fef7ff;--surf:#f3edf7;--surf-hi:#e6e0e9;--surf-lo:#f7f2fa;--on:#1d1b20;--on-v:#49454f;
  --pri:#6750a4;--on-pri:#fff;--pri-c:#eaddff;--on-pri-c:#21005d;
  --sec-c:#e8def8;--ter-c:#ffd8e4;--on-ter-c:#31111d;
  --spring:cubic-bezier(.34,1.56,.64,1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141218;--surf:#211f26;--surf-hi:#2b2930;--surf-lo:#26242b;--on:#e6e0e9;--on-v:#cac4d0;
  --pri:#d0bcff;--on-pri:#381e72;--pri-c:#4f378b;--on-pri-c:#eaddff;--sec-c:#4a4458;--ter-c:#633b48;--on-ter-c:#ffd8e4}}
:root[data-theme="dark"]{
  --bg:#141218;--surf:#211f26;--surf-hi:#2b2930;--surf-lo:#26242b;--on:#e6e0e9;--on-v:#cac4d0;
  --pri:#d0bcff;--on-pri:#381e72;--pri-c:#4f378b;--on-pri-c:#eaddff;--sec-c:#4a4458;--ter-c:#633b48;--on-ter-c:#ffd8e4}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--on);font-family:"Google Sans Flex","Google Sans","Segoe UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;min-height:100%;display:flex;justify-content:center}
.app{width:100%;max-width:500px;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
h1{margin:6px 4px 0;font-size:30px;font-weight:700;letter-spacing:-.5px}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.stat{background:var(--pri-c);color:var(--on-pri-c);border-radius:28px;padding:10px 16px;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;gap:8px;justify-content:center;align-items:center;transition:transform .3s var(--spring);position:relative}
.stat.t{background:var(--ter-c);color:var(--on-ter-c)}
.stat small{font-size:18px}.stat.bump{transform:scale(1.12)}
.plus{position:absolute;right:14px;top:4px;font-size:18px;font-weight:700;pointer-events:none;animation:plus .8s ease-out forwards}
@keyframes plus{to{transform:translateY(-26px);opacity:0}}
.round{width:68px;height:68px;border:0;font-size:30px;background:var(--pri);color:var(--on-pri);border-radius:50%;cursor:pointer;transition:border-radius .5s var(--spring),transform .4s var(--spring);display:grid;place-items:center}
.round:hover{border-radius:30%}.round:active{transform:scale(.88);border-radius:42%}
.spin{animation:spin .6s var(--spring)}
@keyframes spin{from{transform:rotate(-200deg) scale(.5)}to{transform:none}}
.seg{display:flex;background:var(--surf);border-radius:999px;padding:4px;position:relative}
.seg button{flex:1;border:0;background:none;color:var(--on-v);font:600 15px inherit;font-family:inherit;padding:11px 0;border-radius:999px;cursor:pointer;position:relative;z-index:1;transition:color .3s}
.seg button.on{color:var(--on-pri)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--pri);border-radius:999px;transition:transform .5s var(--spring)}
.wrap{background:var(--surf);border-radius:36px;padding:10px;position:relative}
.over{position:absolute;inset:10px;border-radius:28px;background:color-mix(in srgb,var(--surf) 78%,transparent);display:none;place-items:center;font-size:34px;font-weight:800;color:var(--on);backdrop-filter:blur(3px);z-index:3;pointer-events:none}
.over.show{display:grid;animation:fade .5s forwards;opacity:0}
.over span{animation:dlg .6s var(--spring) .1s both}
.wrap.shake{animation:shake .6s}
@keyframes shake{10%,90%{transform:translate(-3px,1px)}20%,80%{transform:translate(5px,-2px)}30%,50%,70%{transform:translate(-8px,2px)}40%,60%{transform:translate(8px,-1px)}}
.board{position:relative;aspect-ratio:1;container-type:inline-size;touch-action:none;display:grid;grid-template-columns:repeat(var(--n),1fr)}
.slot{padding:calc(100cqw/var(--n)*.06)}
.slot::after{content:"";display:block;width:100%;height:100%;border:2px solid var(--on-v);opacity:.1;border-radius:28%}
.tile{position:absolute;width:calc(100%/var(--n));height:calc(100%/var(--n));left:calc(var(--c)*100%/var(--n));top:calc(var(--r)*100%/var(--n));padding:calc(100cqw/var(--n)*.06);transition:left .14s cubic-bezier(.3,.9,.4,1.1),top .14s cubic-bezier(.3,.9,.4,1.1)}
.in{width:100%;height:100%;border-radius:28%;display:grid;place-items:center;font-weight:800;line-height:1;background:hsl(var(--h) var(--s) var(--l));color:var(--tc);font-size:calc(100cqw/var(--n)*var(--f))}
.tile.new .in{animation:appear .35s var(--spring) both}
.tile.pop .in{animation:pop .35s var(--spring)}
@keyframes appear{from{transform:scale(.2);opacity:0;border-radius:50%}}
@keyframes pop{40%{transform:scale(1.2);border-radius:38%}}
.tools{display:flex;gap:10px}
.fab{flex:1;border:0;height:56px;border-radius:20px;background:var(--sec-c);color:var(--on-pri-c);font:700 16px inherit;font-family:inherit;cursor:pointer;transition:border-radius .45s var(--spring),transform .3s var(--spring),opacity .3s}
.fab:active{transform:scale(.94);border-radius:28px}.fab:disabled{opacity:.4;cursor:default}
.ic{width:56px;height:56px;border:0;border-radius:50%;background:var(--surf);color:var(--on-v);font-size:22px;cursor:pointer;transition:border-radius .45s var(--spring),background .3s,transform .3s var(--spring)}
.ic.on{background:var(--pri-c);border-radius:20px;color:var(--on-pri-c)}
.ic:active{transform:scale(.88)}
.hint{margin:0 6px;text-align:center;color:var(--on-v);font-size:13px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;padding:24px;z-index:9;opacity:0}
.scrim.show{display:grid;animation:fade .3s forwards}
@keyframes fade{to{opacity:1}}
.dlg{background:var(--surf-lo);border-radius:36px;padding:28px 24px 20px;max-width:340px;width:100%;text-align:center;animation:dlg .6s var(--spring)}
@keyframes dlg{from{transform:scale(.6) translateY(40px);opacity:0}}
.dlg .big{font-size:56px;animation:spin .8s var(--spring)}
.dlg h2{margin:6px 0;font-size:26px}.dlg p{margin:0 0 20px;color:var(--on-v);line-height:1.5}
.dlg button{border:0;background:var(--pri);color:var(--on-pri);font:700 16px inherit;font-family:inherit;padding:14px 32px;border-radius:999px;cursor:pointer;transition:border-radius .4s var(--spring),transform .3s var(--spring);margin:0 4px}
.dlg button.txt{background:none;color:var(--pri)}
.dlg button:hover{border-radius:16px}.dlg button:active{transform:scale(.92)}
button:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">
  <h1>2048</h1>
  <div class="top">
    <div class="stat" id="score"><small>⭐</small><span>0</span></div>
    <button class="round" id="restart" aria-label="重新开始">↻</button>
    <div class="stat t" id="best"><small>🏆</small><span>0</span></div>
  </div>
  <div class="seg" id="seg"><i></i><button data-n="4" class="on">4×4</button><button data-n="5">5×5</button><button data-n="6">6×6</button></div>
  <div class="wrap" id="wrap"><div class="board" id="board"></div><div class="over" id="over"><span>游戏结束</span></div></div>
  <div class="tools">
    <button class="fab" id="undo" disabled>↶ 撤销</button>
    <button class="ic on" id="snd" aria-label="音效">🔊</button>
    <button class="ic on" id="vib" aria-label="振动">📳</button>
  </div>
  <p class="hint">滑动棋盘、方向键或 WASD 移动 · 相同数字相撞会合并</p>
</div>
<div class="scrim" id="scrim"><div class="dlg"><div class="big" id="dbig"></div><h2 id="dt"></h2><p id="dp"></p><button id="dbtn">再来一局</button><button id="dbtn2" class="txt" style="display:none">继续挑战</button></div></div>

<script>
const $=s=>document.getElementById(s),B=$('board');
const DIRS=[[-1,0],[1,0],[0,1],[0,-1]]; // 上 下 右 左 (dr,dc)
let N=4,tiles=[],score=0,best=0,over=false,won=false,busy=false,undoS=null,snd=true,vibOn=true;
try{snd=localStorage.getItem('g-snd')!=='0';vibOn=localStorage.getItem('g-vib')!=='0'}catch(e){}
const dark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches};

/* 音效 / 振动 */
let ac;
function tone(f,d=.12,type='sine',v=.13,when=0,slide){
  if(!snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),G=ac.createGain(),t=ac.currentTime+when;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  G.gain.setValueAtTime(.0001,t);G.gain.linearRampToValueAtTime(v,t+.004);G.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(G).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const vib=p=>{if(vibOn&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}};
const PENTA=[0,2,4,7,9];
const bell=(f,when=0,v=.16)=>{tone(f,.38,'sine',v,when);tone(f*2.76,.18,'sine',v*.3,when);tone(f*5.4,.08,'sine',v*.12,when)};
const noteOf=v=>{const i=Math.max(0,lg(v)-1);return 523.25*Math.pow(2,(PENTA[i%5]+12*Math.floor(i/5))/12)};
const sfx={
  move:()=>tone(1600,.03,'sine',.05),
  merge:v=>bell(noteOf(v)),
  spawn:()=>tone(2200,.025,'sine',.03),
  win:()=>[0,4,7,12,16].forEach((x,i)=>bell(659*Math.pow(2,x/12),i*.09,.15)),
  lose:()=>[0,-3,-7,-12].forEach((x,i)=>bell(440*Math.pow(2,x/12),i*.13,.12)),
  click:()=>tone(1800,.03,'sine',.06)
};

/* 方块 */
const lg=v=>Math.log2(v);
function look(v){
  const l=lg(v),h=(250+l*28)%360;
  let L,tc;
  if(dark()){L=Math.min(70,26+l*3.6);tc=L>58?'#1d1b20':'#f1ecf6'}
  else{L=Math.max(40,92-l*4.2);tc=L<62?'#fff':'#2a2433'}
  const len=String(v).length;
  return {h,s:(30+l*3)+'%',l:L+'%',tc,f:len<=2?.4:len==3?.32:len==4?.26:.2};
}
function paint(t){
  const o=look(t.v),i=t.el.firstChild;
  i.textContent=t.v;
  for(const k of['h','s','l','tc','f'])i.style.setProperty('--'+k,o[k]);
}
function place(t){t.el.style.setProperty('--r',t.r);t.el.style.setProperty('--c',t.c)}
function mk(v,r,c,cls){
  const el=document.createElement('div');el.className='tile'+(cls?' '+cls:'');el.innerHTML='<div class="in"></div>';
  const t={v,r,c,el};paint(t);place(t);B.appendChild(el);tiles.push(t);return t;
}
function spawn(){
  const used=new Set(tiles.map(t=>t.r*N+t.c)),free=[];
  for(let i=0;i<N*N;i++)if(!used.has(i))free.push(i);
  if(!free.length)return;const k=free[Math.random()*free.length|0];
  mk(Math.random()<.9?2:4,k/N|0,k%N,'new');
}
function init(n){
  if(n)N=n;clearTimeout(init.t);
  B.style.setProperty('--n',N);B.innerHTML='';
  for(let i=0;i<N*N;i++){const d=document.createElement('div');d.className='slot';B.appendChild(d)}
  $('over').classList.remove('show');tiles=[];score=0;over=won=busy=false;undoS=null;$('undo').disabled=true;
  $('score').lastChild.textContent=0;best=0;try{best=+localStorage.getItem('g-best-'+N)||0}catch(e){}
  $('best').lastChild.textContent=best;
  spawn();spawn();
  const r=$('restart');r.classList.remove('spin');void r.offsetWidth;r.classList.add('spin');
}

/* 移动 */
function snap(){return{s:score,t:tiles.map(t=>({v:t.v,r:t.r,c:t.c}))}}
function move(d){
  if(busy||over)return;
  const [dr,dc]=DIRS[d],before=snap();let moved=false,gain=0,merges=[],maxMerge=0;
  const vert=dr!==0;
  tiles.forEach(t=>{t.merged=false;t.into=null}); // 每次移动前重置合并标记
  for(let k=0;k<N;k++){
    const line=tiles.filter(t=>vert?t.c===k:t.r===k).sort((a,b)=>{
      const x=vert?a.r-b.r:a.c-b.c;return (dr+dc)>0?-x:x});
    let slot=0,cur=null;
    for(const t of line){
      if(cur&&cur.v===t.v&&!cur.merged){
        t.into=cur;cur.merged=true;cur.v*=2;gain+=cur.v;maxMerge=Math.max(maxMerge,cur.v);
        if(t.r!==cur.r||t.c!==cur.c)moved=true;
        t.r=cur.r;t.c=cur.c;moved=true;merges.push(cur);
      }else{
        const p=(dr+dc)>0?N-1-slot:slot;slot++;
        const nr=vert?p:k,nc=vert?k:p;
        if(nr!==t.r||nc!==t.c)moved=true;
        t.r=nr;t.c=nc;cur=t;
      }
    }
  }
  if(!moved)return;
  undoS=before;$('undo').disabled=false;busy=true;score+=gain;
  tiles.forEach(place);
  if(gain){
    $('score').lastChild.textContent=score;const e=$('score');e.classList.add('bump');setTimeout(()=>e.classList.remove('bump'),220);
    const p=document.createElement('span');p.className='plus';p.textContent='+'+gain;e.appendChild(p);setTimeout(()=>p.remove(),800);
    if(score>best){best=score;$('best').lastChild.textContent=best;try{localStorage.setItem('g-best-'+N,best)}catch(e){}}
  }
  sfx.move();vib(18);
  init.t=setTimeout(()=>{
    tiles=tiles.filter(t=>{if(t.into){t.el.remove();return false}return true});
    merges.forEach(t=>{paint(t);t.el.classList.remove('pop','new');void t.el.offsetWidth;t.el.classList.add('pop')});
    if(maxMerge){sfx.merge(maxMerge);vib(maxMerge>=512?[40,30,60]:maxMerge>=64?[30,25,30]:30)}
    spawn();sfx.spawn();busy=false;
    if(!won&&maxMerge>=2048){won=true;sfx.win();vib([60,60,60,60,160]);return setTimeout(()=>dialog('🎉','达成 2048!',`当前得分 ${score}`,true),500)}
    if(!canMove()){over=true;sfx.lose();vib([100,60,300]);
      const w=$('wrap');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');$('over').classList.add('show');
      setTimeout(()=>dialog('😵','游戏结束',`最终得分 ${score} · 最高 ${best}`,false),1500)}
  },140);
}
function canMove(){
  if(tiles.length<N*N)return true;
  const g={};tiles.forEach(t=>g[t.r*N+t.c]=t.v);
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=g[r*N+c];if((c+1<N&&g[r*N+c+1]===v)||(r+1<N&&g[(r+1)*N+c]===v))return true}
  return false;
}
function undo(){
  if(!undoS||busy)return;clearTimeout(init.t);
  tiles.forEach(t=>t.el.remove());tiles=[];score=undoS.s;over=false;$('over').classList.remove('show');
  undoS.t.forEach(o=>mk(o.v,o.r,o.c,''));undoS=null;$('undo').disabled=true;
  $('score').lastChild.textContent=score;sfx.click();vib(25);
}
function dialog(big,t,p,w){$('dbig').textContent=big;$('dt').textContent=t;$('dp').textContent=p;$('dbtn2').style.display=w?'':'none';$('scrim').classList.add('show')}

/* 输入 */
addEventListener('keydown',e=>{
  const m={ArrowUp:0,w:0,W:0,ArrowDown:1,s:1,S:1,ArrowRight:2,d:2,D:2,ArrowLeft:3,a:3,A:3}[e.key];
  if(m!==undefined){e.preventDefault();move(m)}
});
let sw=null;
B.addEventListener('pointerdown',e=>sw={x:e.clientX,y:e.clientY});
B.addEventListener('pointermove',e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(Math.hypot(dx,dy)>28){move(Math.abs(dx)>Math.abs(dy)?(dx>0?2:3):(dy>0?1:0));sw=null}
});
['pointerup','pointercancel','pointerleave'].forEach(n=>B.addEventListener(n,()=>sw=null));
$('restart').onclick=()=>{sfx.click();vib(25);$('scrim').classList.remove('show');init()};
$('dbtn').onclick=()=>{$('scrim').classList.remove('show');sfx.click();init()};
$('dbtn2').onclick=()=>{$('scrim').classList.remove('show');sfx.click()};
$('undo').onclick=undo;
function setT(id,on,a,b){const e=$(id);e.classList.toggle('on',on);e.textContent=on?a:b}
$('snd').onclick=()=>{snd=!snd;setT('snd',snd,'🔊','🔇');try{localStorage.setItem('g-snd',snd?1:0)}catch(e){}sfx.click()};
$('vib').onclick=()=>{vibOn=!vibOn;setT('vib',vibOn,'📳','📴');try{localStorage.setItem('g-vib',vibOn?1:0)}catch(e){}vib(50)};
document.querySelectorAll('#seg button').forEach((b,k)=>b.onclick=()=>{
  document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelector('#seg i').style.transform=`translateX(${k*100}%)`;
  sfx.click();vib(25);$('scrim').classList.remove('show');init(+b.dataset.n);
});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>tiles.forEach(paint));
setT('snd',snd,'🔊','🔇');setT('vib',vibOn,'📳','📴');
init();
</script>
</body>
</html>
