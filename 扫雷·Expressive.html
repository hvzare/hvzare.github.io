<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扫雷 · Expressive</title>
<style>
:root{
  --bg:#fef7ff;--surf:#f3edf7;--surf-hi:#e6e0e9;--surf-lo:#f7f2fa;--on:#1d1b20;--on-v:#49454f;
  --pri:#6750a4;--on-pri:#fff;--pri-c:#eaddff;--on-pri-c:#21005d;
  --sec-c:#e8def8;--ter-c:#ffd8e4;--on-ter-c:#31111d;--err:#b3261e;--err-c:#f9dedc;--nl:38%;
  --spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,0,0,1);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141218;--surf:#211f26;--surf-hi:#36343b;--surf-lo:#1d1b20;--on:#e6e0e9;--on-v:#cac4d0;
  --pri:#d0bcff;--on-pri:#381e72;--pri-c:#4f378b;--on-pri-c:#eaddff;--sec-c:#4a4458;--ter-c:#633b48;--on-ter-c:#ffd8e4;--err:#f2b8b5;--err-c:#8c1d18;--nl:72%}}
:root[data-theme="dark"]{
  --bg:#141218;--surf:#211f26;--surf-hi:#36343b;--surf-lo:#1d1b20;--on:#e6e0e9;--on-v:#cac4d0;
  --pri:#d0bcff;--on-pri:#381e72;--pri-c:#4f378b;--on-pri-c:#eaddff;--sec-c:#4a4458;--ter-c:#633b48;--on-ter-c:#ffd8e4;--err:#f2b8b5;--err-c:#8c1d18;--nl:72%}
*{box-sizing:border-box;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--on);font-family:"Google Sans Flex","Google Sans","Segoe UI","PingFang SC","Noto Sans SC",system-ui,sans-serif;min-height:100%;display:flex;justify-content:center}
.app{width:100%;max-width:500px;padding:16px 16px 28px;display:flex;flex-direction:column;gap:14px}
h1{margin:6px 4px 0;font-size:30px;font-weight:700;letter-spacing:-.5px}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.stat{background:var(--pri-c);color:var(--on-pri-c);border-radius:28px;padding:10px 16px;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px;justify-content:center;transition:transform .3s var(--spring)}
.stat.t{background:var(--ter-c);color:var(--on-ter-c)}
.stat small{font-size:18px}
.stat.bump{transform:scale(1.12)}
.face{width:68px;height:68px;border:0;font-size:34px;background:var(--pri);color:var(--on-pri);border-radius:50%;cursor:pointer;transition:border-radius .5s var(--spring),transform .4s var(--spring);display:grid;place-items:center}
.face:hover{border-radius:30%}.face:active{transform:scale(.88);border-radius:42%}
.face.spin{animation:spin .6s var(--spring)}
@keyframes spin{from{transform:rotate(-200deg) scale(.5)}to{transform:none}}
.seg{display:flex;background:var(--surf);border-radius:999px;padding:4px;gap:4px;position:relative}
.seg button{flex:1;border:0;background:none;color:var(--on-v);font:600 15px inherit;font-family:inherit;padding:11px 0;border-radius:999px;cursor:pointer;position:relative;z-index:1;transition:color .3s}
.seg button.on{color:var(--on-pri)}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 16px)/3);background:var(--pri);border-radius:999px;transition:transform .5s var(--spring)}
.board-wrap{background:var(--surf);border-radius:36px;padding:10px;position:relative}
.board{display:grid;gap:3px;grid-template-columns:repeat(var(--cols),1fr);touch-action:manipulation}
.board.shake{animation:shake .6s}
@keyframes shake{10%,90%{transform:translate(-3px,1px)}20%,80%{transform:translate(5px,-2px)}30%,50%,70%{transform:translate(-8px,2px)}40%,60%{transform:translate(8px,-1px)}}
.cell{aspect-ratio:1;border-radius:32%;background:var(--surf-hi);display:grid;place-items:center;font-weight:800;font-size:clamp(12px,4.6vw,22px);cursor:pointer;position:relative;transition:border-radius .35s var(--spring),transform .3s var(--spring),background .25s;line-height:1}
@media (hover:hover){.cell:not(.r):hover{border-radius:50%;background:var(--sec-c)}}
.cell:not(.r):active{transform:scale(.84);border-radius:50%}
.cell.r{background:var(--surf-lo);cursor:default;border-radius:26%;color:hsl(calc(var(--n)*48 + 215) 62% var(--nl));animation:pop .5s var(--spring) var(--d,0ms) both}
.cell.r:not([data-n]),.cell.r[data-n="0"]{color:transparent}
.cell.f{background:var(--ter-c);animation:flag .45s var(--spring)}
.cell.m{background:var(--err-c);border-radius:50%;animation:boom .6s var(--spring) var(--d,0ms) both}
.cell.x{background:var(--err);animation:boom .6s var(--spring) both,pulse 1s .6s infinite}
.cell.w{animation:wave .8s var(--spring) var(--d,0ms) both;background:var(--pri-c);border-radius:50%}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:none;opacity:1}}
@keyframes flag{0%{transform:scale(.5) rotate(-25deg)}100%{transform:none}}
@keyframes boom{0%{transform:scale(.2);opacity:0;box-shadow:0 0 0 0 var(--err)}50%{transform:scale(1.5);opacity:1;box-shadow:0 0 0 10px transparent}100%{transform:none;box-shadow:0 0 0 0 transparent}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes wave{0%{transform:none}40%{transform:translateY(-12px) scale(1.2)}100%{transform:none}}
.tools{display:flex;gap:10px;align-items:center}
.fab{flex:1;border:0;height:56px;border-radius:20px;background:var(--sec-c);color:var(--on-pri-c);font:700 16px inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:border-radius .45s var(--spring),background .3s,transform .3s var(--spring)}
.fab:active{transform:scale(.94)}
.fab.on{background:var(--pri);color:var(--on-pri);border-radius:28px}
.ic{width:56px;height:56px;border:0;border-radius:50%;background:var(--surf);color:var(--on-v);font-size:22px;cursor:pointer;transition:border-radius .45s var(--spring),background .3s,transform .3s var(--spring)}
.ic.on{background:var(--pri-c);border-radius:20px;color:var(--on-pri-c)}
.ic:active{transform:scale(.88)}
.hint{margin:0 6px;text-align:center;color:var(--on-v);font-size:13px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center;padding:24px;z-index:9;opacity:0}
.scrim.show{display:grid;animation:fade .3s forwards}
@keyframes fade{to{opacity:1}}
.dlg{background:var(--surf-lo);border-radius:36px;padding:28px 24px 20px;max-width:340px;width:100%;text-align:center;animation:dlg .6s var(--spring)}
@keyframes dlg{from{transform:scale(.6) translateY(40px);opacity:0}}
.dlg .big{font-size:56px;animation:spin .8s var(--spring)}
.dlg h2{margin:6px 0 6px;font-size:26px}
.dlg p{margin:0 0 20px;color:var(--on-v);line-height:1.5}
.dlg button{border:0;background:var(--pri);color:var(--on-pri);font:700 16px inherit;font-family:inherit;padding:14px 32px;border-radius:999px;cursor:pointer;transition:border-radius .4s var(--spring),transform .3s var(--spring)}
.dlg button:hover{border-radius:16px}.dlg button:active{transform:scale(.92)}
button:focus-visible,.cell:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div class="app">
  <h1>扫雷</h1>
  <div class="top">
    <div class="stat" id="mines"><small>🚩</small><span>10</span></div>
    <button class="face" id="face" aria-label="重新开始">🙂</button>
    <div class="stat t" id="time"><small>⏱</small><span>000</span></div>
  </div>
  <div class="seg" id="seg"><i></i>
    <button data-l="easy" class="on">简单</button><button data-l="med">中等</button><button data-l="hard">困难</button>
  </div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div class="tools">
    <button class="fab" id="flagmode">🚩 插旗模式</button>
    <button class="ic on" id="snd" aria-label="音效">🔊</button>
    <button class="ic on" id="vib" aria-label="振动">📳</button>
  </div>
  <p class="hint">点击翻开 · 长按或右键插旗 · 点击已满足旗数的数字可快速展开</p>
</div>
<div class="scrim" id="scrim"><div class="dlg"><div class="big" id="dbig"></div><h2 id="dt"></h2><p id="dp"></p><button id="dbtn">再来一局</button></div></div>

<script>
const LV={easy:[9,9,10],med:[12,10,20],hard:[16,12,36]};
const $=s=>document.getElementById(s);
let level='easy',R,C,M,g,cells=[],started,over,rev,flags,t0,timer,flagMode=false,snd=true,vibOn=true;
try{snd=localStorage.getItem('ms-snd')!=='0';vibOn=localStorage.getItem('ms-vib')!=='0'}catch(e){}

/* ---------- 音效与振动 ---------- */
let ac;
const AC=()=>ac||(ac=new(window.AudioContext||window.webkitAudioContext)());
function tone(f,d=.12,type='sine',v=.14,when=0,slide){
  if(!snd)return;try{
  const a=AC(),o=a.createOscillator(),G=a.createGain(),t=a.currentTime+when;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  G.gain.setValueAtTime(v,t);G.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(G).connect(a.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.6,v=.3){
  if(!snd)return;try{
  const a=AC(),n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=a.createBufferSource(),G=a.createGain(),F=a.createBiquadFilter();
  F.type='lowpass';F.frequency.setValueAtTime(1800,a.currentTime);F.frequency.exponentialRampToValueAtTime(80,a.currentTime+d);
  G.gain.value=v;s.buffer=b;s.connect(F).connect(G).connect(a.destination);s.start()}catch(e){}}
const vib=p=>{if(vibOn&&navigator.vibrate){try{navigator.vibrate(p)}catch(e){}}};
const sfx={
  reveal:n=>tone(420+n*60,.09,'sine',.12),
  cascade:k=>{for(let i=0;i<Math.min(k,8);i++)tone(380+i*70,.1,'triangle',.08,i*.035)},
  flag:()=>{tone(660,.08,'square',.06);tone(880,.1,'square',.06,.06)},
  unflag:()=>tone(440,.1,'square',.05,0,300),
  boom:()=>{noise(.8,.35);tone(140,.7,'sawtooth',.2,0,35)},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.35,'triangle',.14,i*.1)),
  click:()=>tone(300,.06,'sine',.08)
};

/* ---------- 游戏逻辑 ---------- */
const nb=i=>{const r=i/C|0,c=i%C,o=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(!a&&!b)continue;const y=r+a,x=c+b;if(y>=0&&y<R&&x>=0&&x<C)o.push(y*C+x)}return o};
function init(){
  [R,C,M]=LV[level];g=Array.from({length:R*C},()=>({m:0,r:0,f:0,n:0}));
  started=over=false;rev=flags=0;clearInterval(timer);
  const b=$('board');b.style.setProperty('--cols',C);b.innerHTML='';cells=[];
  for(let i=0;i<R*C;i++){const d=document.createElement('div');d.className='cell';d.dataset.i=i;d.setAttribute('role','button');b.appendChild(d);cells.push(d)}
  // 入场动画
  cells.forEach((d,i)=>{d.style.animation=`pop .5s var(--spring) ${((i/C|0)+(i%C))*18}ms both`});
  setTimeout(()=>cells.forEach(d=>d.style.animation=''),1200);
  $('face').textContent='🙂';$('face').classList.remove('spin');void $('face').offsetWidth;$('face').classList.add('spin');
  upd();$('time').lastChild.textContent='000';
}
function place(safe){
  const ban=new Set([safe,...nb(safe)]);let k=0;
  while(k<M){const i=Math.random()*R*C|0;if(g[i].m||ban.has(i))continue;g[i].m=1;k++}
  g.forEach((c,i)=>c.n=nb(i).filter(j=>g[j].m).length);
}
function paint(i,delay){
  const c=g[i],el=cells[i];
  let cls='cell'+(c.r?' r':'')+(c.f?' f':'')+(c.r&&c.m?' m':'');
  if(el.className!==cls)el.className=cls;
  if(delay!=null)el.style.setProperty('--d',delay+'ms');
  el.style.setProperty('--n',c.n);
  el.dataset.n=c.n||'';
  el.textContent=c.r?(c.m?'💣':(c.n||'')):(c.f?'🚩':'');
}
function upd(){const s=$('mines').lastChild;s.textContent=M-flags;}
function startTimer(){t0=Date.now();timer=setInterval(()=>{$('time').lastChild.textContent=String(Math.min(999,(Date.now()-t0)/1000|0)).padStart(3,'0')},250)}

function openCells(start){ // BFS 翻开,返回是否踩雷
  const q=[[start,0]],seen=new Set([start]);let n=0,hit=-1;
  while(q.length){
    const [i,d]=q.shift(),c=g[i];
    if(c.r||c.f)continue;
    c.r=1;rev++;n++;paint(i,d*32);
    if(c.m){hit=i;continue}
    if(c.n===0)for(const j of nb(i))if(!seen.has(j)){seen.add(j);q.push([j,d+1])}
  }
  return {n,hit};
}
function act(i){
  if(over)return;const c=g[i];
  if(c.f)return;
  if(c.r){chord(i);return}
  if(!started){started=true;place(i);startTimer()}
  const {n,hit}=openCells(i);
  if(hit>=0)return lose(hit);
  if(n>1){sfx.cascade(n);vib([12,30,12])}else{sfx.reveal(c.n);vib(10)}
  if(rev===R*C-M)win();
}
function chord(i){
  const c=g[i];if(!c.n)return;
  const ns=nb(i);if(ns.filter(j=>g[j].f).length!==c.n)return;
  let hit=-1,n=0;
  for(const j of ns){if(g[j].f||g[j].r)continue;const r=openCells(j);n+=r.n;if(r.hit>=0)hit=r.hit}
  if(hit>=0)return lose(hit);
  if(n){sfx.cascade(n);vib([12,30,12])}
  if(rev===R*C-M)win();
}
let lastFlagT=0;
function flag(i){
  if(over)return;lastFlagT=Date.now();const c=g[i];if(c.r)return;
  c.f=!c.f;flags+=c.f?1:-1;paint(i);upd();
  c.f?sfx.flag():sfx.unflag();vib(c.f?[25]:8);
  const m=$('mines');m.classList.add('bump');setTimeout(()=>m.classList.remove('bump'),200);
}
function lose(hit){
  over=true;clearInterval(timer);$('face').textContent='😵';
  cells[hit].classList.add('x');
  sfx.boom();vib([80,40,160,40,300]);
  const b=$('board');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
  let k=0;g.forEach((c,i)=>{if(c.m&&i!==hit&&!c.f){c.r=1;paint(i,200+k++*70)}});
  setTimeout(()=>dialog('💥','踩到雷了','再试一次,这次一定能避开。'),1300+Math.min(k,12)*60);
}
function win(){
  over=true;clearInterval(timer);$('face').textContent='😎';
  const s=Math.max(1,(Date.now()-t0)/1000|0);
  g.forEach((c,i)=>{if(c.m&&!c.f){c.f=1;paint(i)}});flags=M;upd();
  cells.forEach((el,i)=>{el.classList.add('w');el.style.setProperty('--d',(((i/C|0)+(i%C))*40)+'ms')});
  sfx.win();vib([30,50,30,50,120]);
  let best='';try{const k='ms-best-'+level,o=+localStorage.getItem(k);if(!o||s<o){localStorage.setItem(k,s);best=o?'新纪录!':'首次通关!'}else best='最佳 '+o+' 秒'}catch(e){}
  setTimeout(()=>dialog('🎉','你赢了!',`用时 ${s} 秒 · ${best}`),1400);
}
function dialog(big,t,p){$('dbig').textContent=big;$('dt').textContent=t;$('dp').textContent=p;$('scrim').classList.add('show')}

/* ---------- 交互 ---------- */
const board=$('board');let press=null;
board.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.cell');if(!el||e.button===2)return;
  const i=+el.dataset.i;
  if(!over&&!g[i].r)$('face').textContent='😮';
  press={i,long:false,x:e.clientX,y:e.clientY,t:setTimeout(()=>{press.long=true;flag(i)},380)};
});
board.addEventListener('pointermove',e=>{if(press&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>10){clearTimeout(press.t);press=null}});
const endPress=e=>{
  if(!press)return;clearTimeout(press.t);const p=press;press=null;
  if(!over)$('face').textContent='🙂';
  if(!p.long&&e.type==='pointerup'){flagMode&&!g[p.i].r?flag(p.i):act(p.i)}
};
board.addEventListener('pointerup',endPress);board.addEventListener('pointercancel',endPress);
board.addEventListener('contextmenu',e=>{e.preventDefault();
  if(Date.now()-lastFlagT<700||(press&&press.long))return; // 触屏长按已插旗,忽略系统补发的 contextmenu
  const el=e.target.closest('.cell');if(el)flag(+el.dataset.i)});

$('face').onclick=()=>{sfx.click();vib(15);init()};
$('dbtn').onclick=()=>{$('scrim').classList.remove('show');sfx.click();init()};
$('flagmode').onclick=e=>{flagMode=!flagMode;e.currentTarget.classList.toggle('on',flagMode);sfx.click();vib(10)};
function setToggle(id,on,icOn,icOff){const b=$(id);b.classList.toggle('on',on);b.textContent=on?icOn:icOff}
$('snd').onclick=()=>{snd=!snd;setToggle('snd',snd,'🔊','🔇');try{localStorage.setItem('ms-snd',snd?1:0)}catch(e){};sfx.click()};
$('vib').onclick=()=>{vibOn=!vibOn;setToggle('vib',vibOn,'📳','📴');try{localStorage.setItem('ms-vib',vibOn?1:0)}catch(e){};vib(30)};
document.querySelectorAll('#seg button').forEach((b,k)=>b.onclick=()=>{
  level=b.dataset.l;document.querySelectorAll('#seg button').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelector('#seg i').style.transform=`translateX(${k*100}%) translateX(${k*4}px)`;
  sfx.click();vib(12);init();
});
setToggle('snd',snd,'🔊','🔇');setToggle('vib',vibOn,'📳','📴');
init();
</script>
</body>
</html>
