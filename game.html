<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HVZARE 扫雷</title>
<style>
:root{
--primary:#D0BCFF;
--surface:rgba(255,255,255,.14);
--border:rgba(255,255,255,.25);
}
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
min-height:100vh;
background:#141218;
font-family:"Google Sans","Microsoft YaHei",sans-serif;
color:white;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}
.wallpaper{
position:fixed;
inset:-80px;
z-index:-2;
background:
linear-gradient(
rgba(20,18,24,.35),
rgba(20,18,24,.85)
),
url("../../assets/wallpaper.jpg");
background-size:cover;
background-position:center;
animation:bgMove 20s infinite alternate;
}
@keyframes bgMove{
from{
transform:scale(1);
}
to{
transform:scale(1.15);
}
}
.container{
background:rgba(255,255,255,.14);
backdrop-filter:blur(35px);
-webkit-backdrop-filter:blur(35px);
border:1px solid var(--border);
border-radius:36px;
padding:30px;
box-shadow:0 30px 80px rgba(0,0,0,.5);
text-align:center;
max-width:95vw;
}
.home{
position:fixed;
top:20px;
left:20px;
padding:12px 20px;
border-radius:50px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(20px);
color:white;
text-decoration:none;
border:1px solid var(--border);
}
h1{
color:var(--primary);
margin-bottom:20px;
}
.info{
display:flex;
justify-content:space-around;
margin-bottom:15px;
}
button,select{
padding:12px 20px;
margin:5px;
border:0;
border-radius:50px;
background:#D0BCFF;
color:#21005D;
font-weight:bold;
}
.board-box{
overflow:auto;
max-width:90vw;
}
.board{
display:grid;
gap:5px;
margin-top:20px;
}
.cell{
width:36px;
height:36px;
border-radius:10px;
background:#49454F;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
cursor:pointer;
transition:.2s;
}
.cell:hover{
transform:scale(1.1);
}
.open{
background:#EADDFF;
color:#21005D;
}
.mine{
background:#BA1A1A;
}
.flag{
background:#6750A4;
}
.message{
margin-top:20px;
color:#EADDFF;
}
@media(max-width:600px){
.cell{
width:30px;
height:30px;
}
.container{
padding:20px;
}
}
</style>
</head>
<body>
<div class="wallpaper"></div>
<a class="home" href="../../index.html">← 返回主页</a>
<div class="container">
<h1>💣 扫雷</h1>
<div class="info">
<div>💣 <span id="mineCount">10</span></div>
<div>⏱ <span id="time">0</span></div>
<div>🏆 <span id="best">-</span></div>
</div>
<select id="level" onchange="changeLevel()">
<option value="easy">初级 9×9</option>
<option value="normal">中级 16×16</option>
<option value="hard">高级 30×16</option>
</select>
<br>
<button onclick="restart()">重新开始</button>
<button onclick="toggleFlag()">🚩 插旗</button>
<div class="board-box">
<div class="board" id="board"></div>
</div>
<div class="message" id="msg">⛏ 开始游戏</div>
</div>
<script>
const levels={
easy:{rows:9,cols:9,mine:10},
normal:{rows:16,cols:16,mine:40},
hard:{rows:16,cols:30,mine:99}
};
let rows=9;
let cols=9;
let mineCount=10;
let board=[];
let gameOver=false;
let flagMode=false;
let seconds=0;
let timer;
const boardDiv=document.getElementById("board");
const msg=document.getElementById("msg");
const time=document.getElementById("time");
const mineText=document.getElementById("mineCount");
const bestText=document.getElementById("best");
function changeLevel(){
let level=document.getElementById("level").value;
rows=levels[level].rows;
cols=levels[level].cols;
mineCount=levels[level].mine;
restart();
}
function restart(){
clearInterval(timer);
seconds=0;
time.innerText=0;
gameOver=false;
flagMode=false;
msg.innerText="⛏ 开始游戏";
mineText.innerText=mineCount;
createBoard();
timer=setInterval(()=>{
seconds++;
time.innerText=seconds;
},1000);
}
function toggleFlag(){
flagMode=!flagMode;
msg.innerText=flagMode?"🚩 插旗模式":"⛏ 挖掘模式";
}
function createBoard(){
board=[];
boardDiv.innerHTML="";
boardDiv.style.gridTemplateColumns=`repeat(${cols},36px)`;
for(let y=0;y<rows;y++){
board[y]=[];
for(let x=0;x<cols;x++){
board[y][x]={
mine:false,
open:false,
flag:false,
num:0
};
}
}
let mines=0;
while(mines<mineCount){
let x=Math.floor(Math.random()*cols);
let y=Math.floor(Math.random()*rows);
if(!board[y][x].mine){
board[y][x].mine=true;
mines++;
}
}
for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){
if(!board[y][x].mine){
board[y][x].num=countMine(x,y);
}
}
}
for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){
let cell=document.createElement("div");
cell.className="cell";
cell.onclick=()=>{
if(flagMode){
flag(x,y);
}else{
open(x,y);
}
};
cell.oncontextmenu=e=>{
e.preventDefault();
flag(x,y);
};
boardDiv.appendChild(cell);
}
}
}
function countMine(x,y){
let count=0;
for(let dy=-1;dy<=1;dy++){
for(let dx=-1;dx<=1;dx++){
let cell=board[y+dy]?.[x+dx];
if(cell&&cell.mine){
count++;
}
}
}
return count;
}
function open(x,y){
if(gameOver)return;
let c=board[y][x];
if(c.open||c.flag)return;
c.open=true;
let dom=document.querySelectorAll(".cell")[y*cols+x];
dom.classList.add("open");
if(c.mine){
dom.innerText="💣";
dom.classList.add("mine");
showAllMines();
end(false);
return;
}
if(c.num){
dom.innerText=c.num;
}else{
for(let dy=-1;dy<=1;dy++){
for(let dx=-1;dx<=1;dx++){
let nx=x+dx;
let ny=y+dy;
if(board[ny]?.[nx]){
open(nx,ny);
}
}
}
}
checkWin();
}
function flag(x,y){
if(gameOver)return;
let c=board[y][x];
if(c.open)return;
c.flag=!c.flag;
let dom=document.querySelectorAll(".cell")[y*cols+x];
if(c.flag){
dom.innerText="🚩";
dom.classList.add("flag");
}else{
dom.innerText="";
dom.classList.remove("flag");
}
}
function showAllMines(){
for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){
if(board[y][x].mine){
let dom=document.querySelectorAll(".cell")[y*cols+x];
dom.innerText="💣";
dom.classList.add("mine");
}
}
}
}
function checkWin(){
let opened=0;
for(let y=0;y<rows;y++){
for(let x=0;x<cols;x++){
if(board[y][x].open){
opened++;
}
}
}
if(opened===rows*cols-mineCount){
end(true);
}
}
function end(win){
gameOver=true;
clearInterval(timer);
if(win){
let old=localStorage.getItem("mineBest");
if(!old||seconds<Number(old)){
localStorage.setItem("mineBest",seconds);
}
msg.innerText="🎉 扫雷成功！";
}else{
msg.innerText="💥 游戏失败！";
}
bestText.innerText=localStorage.getItem("mineBest")||"-";
document.querySelector(".container").animate(
[
{transform:"scale(1)"},
{transform:"scale(1.05)"},
{transform:"scale(1)"}
],
{
duration:400
}
);
}
bestText.innerText=localStorage.getItem("mineBest")||"-";
restart();
</script>
</body>
</html>
