<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>HVZARE ReadBook</title>


<style>

:root{
--primary:#D0BCFF;
--bg:#101014;
--surface:#1c1b20;
--text:#e6e1e5;
}


.light{
--bg:#faf7ff;
--surface:#ffffff;
--text:#222;
}


*{
box-sizing:border-box;
}


body{

margin:0;

background:var(--bg);

color:var(--text);

font-family:

"Noto Sans SC",
Arial;

transition:.3s;

}



header{

height:64px;

display:flex;

align-items:center;

padding:0 18px;

background:var(--surface);

position:sticky;

top:0;

z-index:10;

}



.logo{

font-size:20px;

font-weight:bold;

flex:1;

}



button{

background:var(--primary);

border:0;

padding:10px 16px;

border-radius:22px;

margin-left:8px;

}



.main{

max-width:900px;

margin:auto;

padding:20px;

}



.card{

background:var(--surface);

padding:20px;

border-radius:22px;

margin-bottom:20px;

}



.reader{

height:70vh;

overflow-y:auto;

font-size:18px;

line-height:2;

}



.hidden{

display:none;

}


input{

display:none;

}


.upload{

display:inline-block;

background:var(--primary);

color:#000;

padding:12px 20px;

border-radius:25px;

cursor:pointer;

}


#progress{

opacity:.7;

font-size:14px;

}


</style>

</head>



<body>



<header>


<div class="logo">

📖 HVZARE ReadBook

</div>


<button onclick="fontUp()">
A+
</button>


<button onclick="fontDown()">
A-
</button>


<button onclick="theme()">
☾
</button>


</header>





<div class="main">



<div id="home"
class="card">


<h2>

📂 打开书籍

</h2>



<label class="upload">


选择文件


<input 
type="file"
id="file"
accept=".txt,.md,.html">


</label>



<p>

支持 TXT / Markdown / HTML

</p>


</div>





<div id="readerBox"
class="card hidden">


<button onclick="back()">

返回

</button>



<h2 id="title">

</h2>



<div id="progress">

阅读进度：0%

</div>



<div id="content"
class="reader">

</div>



</div>



</div>





<script>


let size=18;


const fileInput=
document.getElementById("file");


const content=
document.getElementById("content");





fileInput.onchange=function(e){


let file=e.target.files[0];


if(!file)return;



let reader=
new FileReader();



reader.onload=function(){



document.getElementById("home")
.classList.add("hidden");



document.getElementById("readerBox")
.classList.remove("hidden");



document.getElementById("title")
.innerHTML=
file.name;



let text=
reader.result;



if(file.name.endsWith(".html")){


content.innerHTML=text;


}

else{


content.innerHTML=

text

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/\n/g,"<br>");



}





// 恢复阅读进度


let save=

localStorage.getItem(

"book_"+file.name

);



setTimeout(()=>{


if(save){

content.scrollTop=
parseInt(save);

}


},300);





content.onscroll=function(){


saveProgress(file.name);


};



};



reader.readAsText(file,"UTF-8");


};






function saveProgress(name){


let pos=

content.scrollTop;



localStorage.setItem(

"book_"+name,

pos

);



let percent=

Math.floor(

pos/

(content.scrollHeight-content.clientHeight)

*100

);



if(percent>100)

percent=100;



document.getElementById("progress")
.innerHTML=

"阅读进度："+percent+"%";


}





function back(){


document.getElementById("readerBox")
.classList.add("hidden");


document.getElementById("home")
.classList.remove("hidden");


}




function fontUp(){


size+=2;


content.style.fontSize=

size+"px";


}





function fontDown(){


if(size>12)

size-=2;


content.style.fontSize=

size+"px";


}




function theme(){


document.body.classList.toggle("light");


}



</script>



</body>

</html>
